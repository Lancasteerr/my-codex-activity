name: Codex Activity

on:
  push:
    branches: [__BRANCH__]
    paths:
      - '__DATA_PATH__'
      - '__DISPLAY_CONFIG_PATH__'
      - '__WORKFLOW_PATH__'
  schedule:
    - cron: '17 0 * * *'
      timezone: __TIMEZONE__
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-activity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: __TOOL_REPOSITORY__@main
        with:
          timezone: __TIMEZONE__
