name: Render Codex Activity

on:
  workflow_call:
    inputs:
      tool_ref:
        description: Immutable tool commit, matching the caller's workflow reference
        required: true
        type: string
      timezone:
        type: string
        default: UTC
      theme:
        type: string
        default: github-dark

permissions:
  contents: write

concurrency:
  group: codex-activity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable tool revision
        env:
          TOOL_REF: ${{ inputs.tool_ref }}
        run: |
          if [[ ! "$TOOL_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'An immutable 40-character tool commit is required.'
            exit 1
          fi

      - name: Checkout Profile and full upload history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: profile
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout matching renderer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Lancasteerr/codex-activity
          ref: ${{ inputs.tool_ref }}
          path: tool
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Render and publish only the SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY_BRANCH: ${{ github.event.repository.default_branch }}
          ACTIVITY_TIMEZONE: ${{ inputs.timezone }}
          ACTIVITY_THEME: ${{ inputs.theme }}
        run: node tool/src/ci.mjs publish "$GITHUB_WORKSPACE/profile"
