name: Codex Activity
description: Render and publish the Profile activity chart using its public statistics.

inputs:
  timezone:
    description: IANA display timezone, matching the workflow schedule
    required: true

runs:
  using: composite
  steps:
    # 完整检出统计历史，更新时间始终取统计文件的最近提交。
    - name: Checkout Profile and upload history
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        path: profile
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0
        persist-credentials: false

    - name: Use Node.js 24
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'

    # 源码随 Action 下载，直接执行当前 Action 的代码，无需第二次检出。
    - name: Render and publish only the SVG
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ACTIVITY_BRANCH: ${{ github.event.repository.default_branch }}
        ACTIVITY_TIMEZONE: ${{ inputs.timezone }}
      run: node "$GITHUB_ACTION_PATH/src/ci.mjs" publish "$GITHUB_WORKSPACE/profile"
